name: henko
description: Administración de pagos semanales - Academia de baile Henko
publish_to: 'none'
version: 1.5.4+11

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.5.1

  # Local DB
  sqflite: ^2.3.3
  path: ^1.9.0
  path_provider: ^2.1.4

  # Imágenes (capturas de pago)
  image_picker: ^1.1.2

  # Abrir WhatsApp / links externos
  url_launcher: ^6.3.0

  # Compartir archivos (backup)
  share_plus: ^10.1.4

  # Selector de archivos (importar backup)
  file_picker: ^8.1.7

  # Formato de fechas y moneda
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  # Regenerar iconos de la app (Android/iOS) desde un PNG fuente
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/henko_logo.png
    - assets/henko_icon_foreground.png
    - assets/henko_icon_background.png

# Configuración para regenerar los iconos de la app.
# Uso: dart run flutter_launcher_icons
flutter_launcher_icons:
  image_path: "assets/henko_icon_legacy.png"
  android: true
  ios: false
  adaptive_icon_background: "assets/henko_icon_background.png"
  adaptive_icon_foreground: "assets/henko_icon_foreground.png"
  adaptive_icon_monochrome: "assets/henko_icon_foreground.png"
