name: henko
description: Administración de pagos semanales - Academia de baile Henko
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.5.1

  # Local DB
  sqflite: ^2.3.3
  path: ^1.9.0
  path_provider: ^2.1.4

  # Imágenes (capturas de pago)
  image_picker: ^1.1.2

  # Formato de fechas y moneda
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/henko_logo.png
